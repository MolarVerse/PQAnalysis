name: Wheels

# Builds the sdist and binary wheels and tests every wheel against the test
# suite. release.yml calls it for every tag; pull requests run it when the
# build changes.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '**/*.pyx'
      - 'scripts/test_wheel.py'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-latest       # arm64
          - macos-15-intel     # x86_64
          - windows-latest     # AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
