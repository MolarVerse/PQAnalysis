name: Pylint

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: head/pyproject.toml

      - name: Install head and lint dependencies
        run: |
          python -m venv head-venv
          head-venv/bin/python -m pip install -e 'head[test]'
          head-venv/bin/python -m pip freeze --exclude-editable > lint-requirements.txt

      - name: Lint head
        working-directory: head
        run: ../head-venv/bin/pylint PQAnalysis --exit-zero --persistent=n --output-format=json2 > ../pylint-head.json

      - name: Lint PR base with the same dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m venv base-venv
          base-venv/bin/python -m pip install -r lint-requirements.txt
          base-venv/bin/python -m pip install --no-deps -e base
          cd base
          ../base-venv/bin/pylint PQAnalysis --exit-zero --persistent=n --output-format=json2 > ../pylint-base.json

      - name: Render report and check scores
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          extra=()
          if [[ -f pylint-base.json ]]; then extra+=(--base pylint-base.json); fi
          head-venv/bin/python head/.github/scripts/parse_pylint.py pylint-head.json \
            "${extra[@]}" --source-url "$SOURCE_URL" --report comment.txt

      - name: Publish summary
        if: always()
        run: |
          if [[ -f comment.txt ]]; then cat comment.txt >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: marocchino/sticky-pull-request-comment@v2
        if: >-
          always() && hashFiles('comment.txt') != '' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: pylint
          path: comment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pylint-report
          path: |
            pylint-head.json
            pylint-base.json
            comment.txt
