name: Publish performance report

on:
  workflow_run:
    workflows: [Performance]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: perf-comment-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR and bot configuration
        id: check
        uses: actions/github-script@v7
        env:
          APP_ID: ${{ secrets.PQ_PERF_BOT_APP_ID }}
          APP_KEY: ${{ secrets.PQ_PERF_BOT_PRIVATE_KEY }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const linked = run.pull_requests[0];
            if (!linked) { core.info('No linked PR; skipping.'); return; }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: linked.number
            });
            if (pr.state !== 'open' || pr.head.sha !== linked.head.sha ||
                pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.info('Closed, stale or external PR; skipping.'); return;
            }
            if (!process.env.APP_ID || !process.env.APP_KEY) {
              core.warning('Configure PQ_PERF_BOT_APP_ID and PQ_PERF_BOT_PRIVATE_KEY. Report remains in the Performance run.');
              return;
            }
            core.setOutput('pr', pr.number);
            core.setOutput('sha', pr.head.sha);

      - name: Download report as data only
        if: steps.check.outputs.pr != ''
        uses: actions/download-artifact@v4
        with:
          name: perf-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Mint posting-only bot token
        if: steps.check.outputs.pr != ''
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PQ_PERF_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_PERF_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post or update the bot comment
        if: steps.check.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.check.outputs.pr }}
          HEAD_SHA: ${{ steps.check.outputs.sha }}
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: issue_number
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) return;
            const file = 'report/perf_report.md';
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.size > 55000) {
              throw new Error('Expected a regular report file under 55 KB');
            }
            const marker = '<!-- perf-report -->';
            const body = `${marker}\n${fs.readFileSync(file, 'utf8')}\n[Workflow run](${context.payload.workflow_run.html_url})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            const existing = comments.find(c =>
              c.user.login === 'pq-perf-bot[bot]' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number, body
              });
            }
