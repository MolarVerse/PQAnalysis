name: Test Coverage

# Only changes that can affect the tests or the coverage start this workflow:
# documentation, changelog and other workflow edits do not. The tests read
# tests/data and the example fixtures under examples/.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'PQAnalysis/**'
      - 'tests/**'
      - 'examples/**'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'pytest.ini'
      - 'pytest.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'PQAnalysis/**'
      - 'tests/**'
      - 'examples/**'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'pytest.ini'
      - 'pytest.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: build PQAnalysis
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Generate coverage report
      run: |
        bash pytest.sh
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        flags: unittests
        verbose: true
